global:
  domain: cx498.coralogix.com
  clusterName: otel-demo-macbook
  deploymentEnvironmentName: production
opentelemetry-cluster-collector:
  presets:
    kubernetesEvents:
      enabled: true
    reduceResourceAttributes:
      enabled: true
    kubernetesResources:
      enabled: true
    fleetManagement:
      enabled: true
      supervisor:
        enabled: false
    resourceDetection:
      enabled: true
      deploymentEnvironmentName: production
    clusterMetrics:
      enabled: true
    collectorMetrics:
      enabled: true
    kubernetesApiServerMetrics:
      enabled: true
      scrapeAll: true
  provider: on_prem
opentelemetry-agent:
  presets:
    hostEntityEvents:
      enabled: true
    fleetManagement:
      enabled: true
      supervisor:
        enabled: false
    spanMetrics:
      enabled: true
      histogramBuckets:
      - 1ms
      - 4ms
      - 10ms
      - 20ms
      - 50ms
      - 100ms
      - 200ms
      - 500ms
      - 1s
      - 2s
      - 5s
      # Runs on every span before spanmetrics and export.
      # Envoy (frontend-proxy) names every server span "ingress" and only records the raw
      # http.url (with sessionId query strings). Derive a low-cardinality http.route and
      # rename the span "<METHOD> <route>" so APM and span metrics break down per endpoint.
      transformStatements:
      - set(attributes["http.route"], attributes["http.url"]) where resource.attributes["service.name"] == "frontend-proxy" and attributes["http.route"] == nil and attributes["http.url"] != nil
      - replace_pattern(attributes["http.route"], "^[a-z]+://[^/]+", "") where resource.attributes["service.name"] == "frontend-proxy"
      - replace_pattern(attributes["http.route"], "\\?.*$", "") where resource.attributes["service.name"] == "frontend-proxy"
      - replace_pattern(attributes["http.route"], "(.)/$", "$$1") where resource.attributes["service.name"] == "frontend-proxy"
      - replace_pattern(attributes["http.route"], "^/api/products/[A-Z0-9]{10}$", "/api/products/:productId") where resource.attributes["service.name"] == "frontend-proxy"
      - replace_pattern(attributes["http.route"], "^/product/[A-Z0-9]{10}$", "/product/:productId") where resource.attributes["service.name"] == "frontend-proxy"
      - replace_pattern(attributes["http.route"], "^/images/products/[^/]+$", "/images/products/:image") where resource.attributes["service.name"] == "frontend-proxy"
      - replace_pattern(attributes["http.route"], "^/images/[^/]+\\.(png|jpg|svg|webp)$", "/images/:image") where resource.attributes["service.name"] == "frontend-proxy"
      - replace_pattern(attributes["http.route"], "^/icons/[^/]+$", "/icons/:icon") where resource.attributes["service.name"] == "frontend-proxy"
      - replace_pattern(attributes["http.route"], "^/_next/static/.*$", "/_next/static/*") where resource.attributes["service.name"] == "frontend-proxy"
      - set(attributes["envoy.span_name"], name) where resource.attributes["service.name"] == "frontend-proxy" and name == "ingress"
      - set(name, Concat([attributes["http.method"], attributes["http.route"]], " ")) where resource.attributes["service.name"] == "frontend-proxy" and name == "ingress" and attributes["http.method"] != nil and attributes["http.route"] != nil
    headSampling:
      enabled: true
      percentage: 10.0
    profilesCollection:
      enabled: false
    resourceDetection:
      enabled: true
      deploymentEnvironmentName: production
    transactions:
      enabled: true
      waitDuration: '30'
    logsCollection:
      enabled: true
      reduceLogAttributes:
        enabled: true
    kubeletMetrics:
      enabled: true
    collectorMetrics:
      enabled: true
    statsdReceiver:
      enabled: true
    hostMetrics:
      enabled: true
      process:
        enabled: true
    kubernetesExtraMetrics:
      enabled: true
      scrapeAll: true
      perNode: true
    reduceResourceAttributes:
      enabled: true
    coralogixExporter:
      enabled: true
      privateKey: ${env:CORALOGIX_PRIVATE_KEY}
      pipelines:
      - logs
      - metrics
      - traces
  targetAllocator:
    enabled: false
  provider: on_prem
opentelemetry-ebpf-profiler:
  presets:
    otlpExporter:
      endpoint: ${env:K8S_NODE_IP}:4317
      pipelines:
      - profiles
      tls:
        insecure: true
      enabled: true
    resourceDetection:
      enabled: true
    fleetManagement:
      enabled: true
      supervisor:
        enabled: false
    ebpfProfiler:
      samplesPerSecond: 20
  enabled: false
opentelemetry-ebpf-instrumentation:
  enabled: true
coralogix-operator:
  enabled: true
  serviceMonitor:
    create: false
  secret:
    data:
      apiKey: ""  # set from CORALOGIX_API_KEY by setup.sh
  coralogixOperator:
    domain: cx498.coralogix.com

