# Values for the opentelemetry-demo chart (release: my-otel-demo).
# Telemetry goes straight to the Coralogix agent DaemonSet (otel-integration chart),
# which listens on hostPorts 4317/4318 on every node. The demo's own collector is
# disabled because its DaemonSet claims the same hostPorts and blocks the agent.

opentelemetry-collector:
  enabled: false

default:
  envOverrides:
    - name: OTEL_COLLECTOR_NAME
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP

components:
  frontend:
    # Demo frontend rebuilt with the Coralogix RUM browser SDK (rum/build.sh).
    # The tag is set by setup.sh (--set components.frontend.imageOverride.tag=...).
    imageOverride:
      repository: otel-demo-frontend-rum
    envOverrides:
      # Read by pages/_document.tsx and passed to the browser via window.ENV.
      - name: CORALOGIX_RUM_PUBLIC_KEY
        valueFrom:
          secretKeyRef:
            name: coralogix-rum
            key: PUBLIC_KEY
            optional: true
      - name: CORALOGIX_RUM_APPLICATION
        value: Frontend
      - name: CORALOGIX_RUM_DOMAIN
        value: US2
      - name: CORALOGIX_RUM_ENVIRONMENT
        value: production
      # Upstream default is http://localhost:8080/..., which breaks for browsers on other
      # machines (their own localhost). Relative works from any host.
      - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: /otlp-http/v1/traces

grafana:
  enabled: false
jaeger:
  enabled: false
opensearch:
  enabled: false
prometheus:
  enabled: false
